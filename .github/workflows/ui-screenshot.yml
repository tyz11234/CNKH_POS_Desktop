name: UI Screenshot Test

on:
  push:
    branches: ["test/ui-screenshot-20260906"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Launch and capture UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Shot([string]$name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
            $bmp.Save((Join-Path $PWD "screenshots/$name.png"),[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $exe = Resolve-Path "build/windows/x64/runner/Release/cnkh_pos_desktop.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 10
          $shell = New-Object -ComObject WScript.Shell
          $shell.AppActivate($p.Id) | Out-Null
          Start-Sleep -Seconds 2
          Shot '01-login'

          # Keyboard-only first-run setup. Focus role selector, choose Admin,
          # then navigate to PIN and submit the same six-digit PIN twice.
          $shell.SendKeys('{TAB}')
          $shell.SendKeys('{LEFT}')
          $shell.SendKeys('{TAB}')
          $shell.SendKeys('{TAB}')
          $shell.SendKeys('839201')
          $shell.SendKeys('{TAB}')
          $shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 1
          $shell.SendKeys('+{TAB}')
          $shell.SendKeys('839201')
          $shell.SendKeys('{TAB}')
          $shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 8
          $p.Refresh()
          "ProcessId=$($p.Id) HasExited=$($p.HasExited) Title=$($p.MainWindowTitle)" | Out-File screenshots/process.txt
          Shot '02-main-after-login'
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cnkh-pos-ui-screenshots
          path: screenshots/
          if-no-files-found: error
