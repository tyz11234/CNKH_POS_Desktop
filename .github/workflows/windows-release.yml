name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Stage package
        shell: pwsh
        run: |
          $ver = (Get-Content pubspec.yaml | Select-String -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          $semver = ($ver -split '\+')[0]
          $name = "CNKH_POS_Desktop-windows-x64-v$($ver -replace '\+','-')"
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "Missing Windows Release folder: $src" }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "$src/*" -DestinationPath "dist/$name.zip" -Force
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$semver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.RELEASE_TAG }}
          files: dist/${{ env.PACKAGE_NAME }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
