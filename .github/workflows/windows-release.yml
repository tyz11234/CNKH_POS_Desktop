name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Install Poppler PDF tools
        run: choco install poppler --yes --no-progress

      - name: Test
        run: flutter test

      - name: Capture actual employee training screens
        run: flutter test tool/training_capture_test.dart

      - name: Upload training screenshots
        uses: actions/upload-artifact@v4
        with:
          name: desktop-training-screenshots
          path: assets/training/

      - name: Verify bundled training image and arrow
        run: flutter test tool/training_view_test.dart

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify training assets in Windows bundle
        run: python tool/verify_training_bundle.py build/windows/x64/runner/Release --kind desktop

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }

      - name: Build per-user Windows installer and bundle Visual C++ runtime
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Stage package
        shell: pwsh
        run: |
          $ver = (Get-Content pubspec.yaml | Select-String -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          $semver = ($ver -split '\+')[0]
          $name = "CNKH_POS_Desktop-windows-x64-v$($ver -replace '\+','-')"
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "Missing Windows Release folder: $src" }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "$src/*" -DestinationPath "dist/$name.zip" -Force
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$semver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $artifacts = @("$name.zip", "$name-Setup.exe")
          $hashes = foreach ($artifact in $artifacts) {
            if (-not (Test-Path "dist/$artifact")) { throw "Missing release artifact: $artifact" }
            $hash = (Get-FileHash "dist/$artifact" -Algorithm SHA256).Hash.ToLower()
            "$hash  $artifact"
          }
          $hashes | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content "dist/SHA256SUMS.txt"

      - name: Verify silent installation and upgrade without starting POS
        shell: pwsh
        run: ./installer/verify-install.ps1 -Installer "dist/${{ env.PACKAGE_NAME }}-Setup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: CNKH POS Desktop ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
