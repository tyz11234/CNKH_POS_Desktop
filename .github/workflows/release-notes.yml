name: Sync published release notes

on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES.md
      - .github/workflows/release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update existing release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+ *$/\1/p' pubspec.yaml)
          test -n "$version"
          tag="v${version}"
          # Do not create a release or alter its tag/assets from a docs update.
          gh release list --limit 100 --json tagName --jq '.[].tagName' > /tmp/cnkh-release-tags.txt
          if ! grep -Fxq "$tag" /tmp/cnkh-release-tags.txt; then
            echo "Release $tag is not published yet; its build workflow will set the initial notes."
            exit 0
          fi
          python3 - <<'PYNOTES'
          from pathlib import Path
          notes = Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
          Path('/tmp/cnkh-release-notes.md').write_text(
              notes.split('\n---\n', 1)[0].strip() + '\n', encoding='utf-8')
          PYNOTES
          gh release edit "$tag" --notes-file /tmp/cnkh-release-notes.md
