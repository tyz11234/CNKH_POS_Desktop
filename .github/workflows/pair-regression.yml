name: Desktop Mobile integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mobile_ref:
        description: Mobile branch/tag/SHA to pair with this Desktop ref
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pair-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Desktop under test
        uses: actions/checkout@v4
        with:
          path: CNKH_POS_Desktop

      - name: Select paired Mobile source
        id: companion
        env:
          REQUESTED_REF: ${{ github.event.inputs.mobile_ref }}
        shell: bash
        run: |
          set -euo pipefail
          paired_ref="$REQUESTED_REF"
          if [[ -z "$paired_ref" ]]; then
            paired_ref=$(tr -d '\r\n' < CNKH_POS_Desktop/.github/paired-mobile-ref)
          fi
          [[ "$paired_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          echo "ref=$paired_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout release-paired Mobile companion
        uses: actions/checkout@v4
        with:
          repository: tyz11234/CNKH_POS_Mobile_APK
          ref: ${{ steps.companion.outputs.ref }}
          path: CNKH_POS_Mobile_APK

      - name: Record exact paired source SHAs
        shell: bash
        run: |
          set -euo pipefail
          echo "Desktop ref: ${{ github.head_ref || github.ref_name }}"
          echo "Desktop SHA: $(git -C CNKH_POS_Desktop rev-parse HEAD)"
          echo "Mobile ref: ${{ steps.companion.outputs.ref }}"
          echo "Mobile SHA: $(git -C CNKH_POS_Mobile_APK rev-parse HEAD)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve companion dependencies
        working-directory: CNKH_POS_Desktop/integration
        run: flutter pub get

      - name: Analyze integration tests
        working-directory: CNKH_POS_Desktop/integration
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test real HTTP synchronization and reconnect
        working-directory: CNKH_POS_Desktop/integration
        run: flutter test test regression
