name: Finalize pagination docs once
on: [push]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pagination-release-20260906
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tools/finalize_pagination_docs_once.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'Document pagination regression and refresh OCR lock'
          git push origin HEAD:fix/pagination-release-20260906
