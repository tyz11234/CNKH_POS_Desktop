name: Patch Reconcile Signal

on:
  push:
    branches:
      - fix/lan-sync-consistency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lan-sync-consistency
          fetch-depth: 0
      - name: Make force reconcile a full-reconcile signal
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/services/lan_pairing_host.dart')
          text = p.read_text(encoding='utf-8')
          old = """  Future<void> forceBroadcast() async {\n    final db = await _db.db;\n    final cursor = await _latestChangeSeq(db);\n    _publish(<String, Object?>{\n      'type': 'catalog',\n      'reason': 'force_reconcile',\n      'data_cursor': cursor,\n    });\n    _publish(<String, Object?>{\n      'type': 'sale',\n      'reason': 'force_reconcile',\n      'data_cursor': cursor,\n    });\n  }\n"""
          new = """  Future<void> forceBroadcast() async {\n    final db = await _db.db;\n    final cursor = await _latestChangeSeq(db);\n    _publish(<String, Object?>{\n      'type': 'reconcile',\n      'reason': 'force_reconcile',\n      'full': true,\n      'data_cursor': cursor,\n    });\n  }\n"""
          if old not in text:
              if "'type': 'reconcile'" in text:
                  raise SystemExit(0)
              raise SystemExit('forceBroadcast pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/lan_pairing_host.dart
          git commit -m "fix: make force reconcile request full sync"
          git push origin HEAD:fix/lan-sync-consistency
